name: 'SSH over WireGuard'
description: >-
  Establish secure encrypted connection to remote server via WireGuard VPN and
  execute SSH commands or SCP file transfers
author: 'Tomachi'
branding:
  icon: 'link'
  color: 'blue'

inputs:
  operation:
    description: 'Operation type: ssh (execute command) or scp (file transfer)'
    required: false
    default: 'ssh'

  command:
    description: >-
      Command to execute on the remote server (only used when operation=ssh)
    required: false
    default: 'hostname && whoami && pwd'

  scp-source:
    description: 'Source path for SCP operation (only used when operation=scp)'
    required: false

  scp-destination:
    description: >-
      Destination path for SCP operation (only used when operation=scp)
    required: false

  scp-direction:
    description: >-
      SCP direction: upload (local to remote) or download (remote to local)
      (only used when operation=scp)
    required: false
    default: 'upload'

  ping-check:
    description: 'Enable ping connectivity test before SSH/SCP operations'
    required: false
    default: 'true'

  # WireGuard Configuration
  wireguard-private-key:
    description: 'WireGuard client private key'
    required: true

  wireguard-address:
    description: 'WireGuard client VPN address (e.g., 10.0.0.2/24)'
    required: true

  wireguard-dns:
    description: 'DNS server address (e.g., 1.1.1.1)'
    required: false
    default: '1.1.1.1'

  wireguard-peer-public-key:
    description: 'WireGuard server public key'
    required: true

  wireguard-preshared-key:
    description: 'WireGuard preshared key (optional security enhancement)'
    required: false

  wireguard-endpoint:
    description: 'WireGuard server endpoint (e.g., server.com:51820)'
    required: true

  wireguard-allowed-ips:
    description: 'Allowed IPs for WireGuard (e.g., 10.0.0.0/24)'
    required: true

  # SSH Configuration
  ssh-private-key:
    description: 'SSH private key for authentication'
    required: true

  ssh-user:
    description: 'SSH username'
    required: true

  ssh-hostname:
    description: 'SSH hostname alias for connection'
    required: true

  ssh-host-ip:
    description: 'SSH server IP address within VPN'
    required: true

  ssh-host-key:
    description: 'SSH server host key for verification'
    required: true

  ssh-port:
    description: 'SSH port number'
    required: false
    default: '22'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        SCP_SOURCE: ${{ inputs.scp-source }}
        SCP_DESTINATION: ${{ inputs.scp-destination }}
        SCP_DIRECTION: ${{ inputs.scp-direction }}
        WG_PRIVATE_KEY: ${{ inputs.wireguard-private-key }}
        WG_ADDRESS: ${{ inputs.wireguard-address }}
        WG_DNS: ${{ inputs.wireguard-dns }}
        WG_PEER_PUBLIC_KEY: ${{ inputs.wireguard-peer-public-key }}
        WG_PRESHARED_KEY: ${{ inputs.wireguard-preshared-key }}
        WG_ENDPOINT: ${{ inputs.wireguard-endpoint }}
        WG_ALLOWED_IPS: ${{ inputs.wireguard-allowed-ips }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        SSH_HOST_IP: ${{ inputs.ssh-host-ip }}
        SSH_HOST_KEY: ${{ inputs.ssh-host-key }}
        SSH_PORT: ${{ inputs.ssh-port }}
      run: |
        # Inputs are only read through environment variables and are never
        # echoed, because several of them are secrets.
        fail() {
          echo "Error: invalid input '$1': $2" >&2
          exit 1
        }

        # Reject CR/LF so a value cannot add keys or sections to generated
        # config files.
        single_line() {
          case "$2" in
            *$'\n'* | *$'\r'*) fail "$1" "must be a single line" ;;
          esac
        }

        case "$OPERATION" in
          ssh | scp) ;;
          *) fail operation "must be 'ssh' or 'scp'" ;;
        esac

        if [ "$OPERATION" = "scp" ]; then
          if [ -z "$SCP_SOURCE" ] || [ -z "$SCP_DESTINATION" ]; then
            echo "Error: scp-source and scp-destination are required" \
                 "when operation=scp" >&2
            exit 1
          fi
          case "$SCP_DIRECTION" in
            upload | download) ;;
            *) fail scp-direction "must be 'upload' or 'download'" ;;
          esac
        fi

        if ! [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] \
           || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
          fail ssh-port "must be a number between 1 and 65535"
        fi
        [[ "$SSH_HOSTNAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
          || fail ssh-hostname "must match [A-Za-z0-9][A-Za-z0-9._-]*"
        [[ "$SSH_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] \
          || fail ssh-user "must match [A-Za-z0-9_][A-Za-z0-9._-]*"
        [[ "$SSH_HOST_IP" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] \
          || fail ssh-host-ip "must be an IP address or host name"

        single_line ssh-host-key "$SSH_HOST_KEY"
        single_line wireguard-private-key "$WG_PRIVATE_KEY"
        single_line wireguard-address "$WG_ADDRESS"
        single_line wireguard-dns "$WG_DNS"
        single_line wireguard-peer-public-key "$WG_PEER_PUBLIC_KEY"
        single_line wireguard-preshared-key "$WG_PRESHARED_KEY"
        single_line wireguard-endpoint "$WG_ENDPOINT"
        single_line wireguard-allowed-ips "$WG_ALLOWED_IPS"

        echo "✅ Input validation passed"

    - name: Install WireGuard
      shell: bash
      run: |
        sudo apt-get update
        
        # Fix potential package conflicts with Docker/containerd
        # This is often needed in GitHub Actions runners
        sudo apt-get install -y --fix-broken
        
        # Install WireGuard tools first (always works)
        sudo apt-get install -y wireguard-tools
        
        # Try to install full WireGuard package with conflict resolution
        if ! sudo apt-get install -y wireguard; then
          echo "⚠️  Full WireGuard package installation failed"
          echo "   This is common in containerized environments like GitHub Actions"
          echo "   Continuing with wireguard-tools only..."
        else
          echo "✅ Full WireGuard package installed successfully"
        fi
        
    - name: Setup WireGuard configuration
      shell: bash
      env:
        WG_PRIVATE_KEY: ${{ inputs.wireguard-private-key }}
        WG_ADDRESS: ${{ inputs.wireguard-address }}
        WG_DNS: ${{ inputs.wireguard-dns }}
        WG_PEER_PUBLIC_KEY: ${{ inputs.wireguard-peer-public-key }}
        WG_PRESHARED_KEY: ${{ inputs.wireguard-preshared-key }}
        WG_ENDPOINT: ${{ inputs.wireguard-endpoint }}
        WG_ALLOWED_IPS: ${{ inputs.wireguard-allowed-ips }}
      run: |
        # Create WireGuard config directory
        sudo mkdir -p /etc/wireguard

        # Create WireGuard configuration file. Values are written with
        # printf so they are data, never shell syntax.
        {
          printf '[Interface]\n'
          printf 'PrivateKey = %s\n' "$WG_PRIVATE_KEY"
          printf 'Address = %s\n' "$WG_ADDRESS"
          printf 'DNS = %s\n' "$WG_DNS"
          printf '\n[Peer]\n'
          printf 'PublicKey = %s\n' "$WG_PEER_PUBLIC_KEY"
          # Add PresharedKey if provided (optional security enhancement)
          if [ -n "$WG_PRESHARED_KEY" ]; then
            printf 'PresharedKey = %s\n' "$WG_PRESHARED_KEY"
          fi
          printf 'Endpoint = %s\n' "$WG_ENDPOINT"
          printf 'AllowedIPs = %s\n' "$WG_ALLOWED_IPS"
          printf 'PersistentKeepalive = 25\n'
        } | sudo tee /etc/wireguard/wg0.conf > /dev/null

        # Set proper permissions
        sudo chmod 600 /etc/wireguard/wg0.conf

        # Enable IP forwarding (if needed)
        echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
        sudo sysctl -p

    - name: Start WireGuard VPN
      shell: bash
      run: |
        # Start WireGuard interface
        sudo wg-quick up wg0

        # Show WireGuard status
        sudo wg show

        # Show IP configuration
        ip addr show wg0

    - name: Setup SSH key
      id: setup-ssh-key
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        SSH_HOST_IP: ${{ inputs.ssh-host-ip }}
        SSH_HOST_KEY: ${{ inputs.ssh-host-key }}
      run: |
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        # Write the SSH private key into a private (0700) unique directory,
        # with umask 077 so the file is never readable by others
        ssh_key_dir=$(umask 077 && mktemp -d)
        echo "ssh-key-dir=$ssh_key_dir" >> "$GITHUB_OUTPUT"
        (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_key_dir/id_rsa")

        # Add server host key to known_hosts for secure connection
        # Format: hostname,ip ssh-key-type ssh-key-data
        # The Cleanup step removes exactly this line.
        printf '%s,%s %s\n' "$SSH_HOSTNAME" "$SSH_HOST_IP" "$SSH_HOST_KEY" \
          >> ~/.ssh/known_hosts
        echo "known-hosts-entry-added=true" >> "$GITHUB_OUTPUT"
        chmod 600 ~/.ssh/known_hosts

    - name: Setup SSH Configuration
      shell: bash
      env:
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        SSH_HOST_IP: ${{ inputs.ssh-host-ip }}
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_PORT: ${{ inputs.ssh-port }}
        SSH_KEY_DIR: ${{ steps.setup-ssh-key.outputs.ssh-key-dir }}
      run: |
        # Set up SSH config for the hostname
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        # Add SSH config entry for the hostname
        {
          printf 'Host %s\n' "$SSH_HOSTNAME"
          printf '  HostName %s\n' "$SSH_HOST_IP"
          printf '  User %s\n' "$SSH_USER"
          printf '  Port %s\n' "$SSH_PORT"
          printf '  IdentityFile %s\n' "$SSH_KEY_DIR/id_rsa"
        } >> ~/.ssh/config
        chmod 600 ~/.ssh/config

    - name: Test VPN connectivity
      shell: bash
      if: ${{ inputs.ping-check == 'true' }}
      env:
        SSH_HOST_IP: ${{ inputs.ssh-host-ip }}
      run: |
        # Test ping to server through VPN
        ping -c 3 -- "$SSH_HOST_IP"

    - name: Execute SSH command
      shell: bash
      if: ${{ inputs.operation == 'ssh' }}
      env:
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        REMOTE_COMMAND: ${{ inputs.command }}
      run: |
        # Execute command on remote server via SSH through VPN.
        # The command is passed as a single argument and is not expanded
        # locally; the remote shell interprets it.
        ssh -- "$SSH_HOSTNAME" "$REMOTE_COMMAND"

    - name: SCP Upload (Local to Remote)
      shell: bash
      if: ${{ inputs.operation == 'scp' && inputs.scp-direction == 'upload' }}
      env:
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        SCP_SOURCE: ${{ inputs.scp-source }}
        SCP_DESTINATION: ${{ inputs.scp-destination }}
      run: |
        # Upload file from local to remote
        echo "Uploading file from local to remote..."
        scp -- "$SCP_SOURCE" "$SSH_HOSTNAME:$SCP_DESTINATION"

    - name: SCP Download (Remote to Local)
      shell: bash
      if: ${{ inputs.operation == 'scp' && inputs.scp-direction == 'download' }}
      env:
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        SCP_SOURCE: ${{ inputs.scp-source }}
        SCP_DESTINATION: ${{ inputs.scp-destination }}
      run: |
        # Download file from remote to local
        echo "Downloading file from remote to local..."
        scp -- "$SSH_HOSTNAME:$SCP_SOURCE" "$SCP_DESTINATION"

    - name: Cleanup
      shell: bash
      if: always()
      env:
        SSH_HOSTNAME: ${{ inputs.ssh-hostname }}
        SSH_HOST_IP: ${{ inputs.ssh-host-ip }}
        SSH_HOST_KEY: ${{ inputs.ssh-host-key }}
        SSH_KNOWN_HOST_ENTRY_ADDED: ${{ steps.setup-ssh-key.outputs.known-hosts-entry-added }}
        SSH_KEY_DIR: ${{ steps.setup-ssh-key.outputs.ssh-key-dir }}
      run: |
        # Stop WireGuard interface
        sudo wg-quick down wg0 || true
        sudo rm -f /etc/wireguard/wg0.conf

        # Remove SSH key and its private directory
        if [ -n "$SSH_KEY_DIR" ]; then
          rm -f "$SSH_KEY_DIR/id_rsa"
          rmdir "$SSH_KEY_DIR" || true
        fi

        # Remove SSH config
        rm -f ~/.ssh/config

        if [ "$SSH_KNOWN_HOST_ENTRY_ADDED" = "true" ] && [ -f ~/.ssh/known_hosts ]; then
            SSH_KNOWN_HOST_ENTRY=$(printf '%s' "$SSH_HOSTNAME,$SSH_HOST_IP $SSH_HOST_KEY")
            export SSH_KNOWN_HOST_ENTRY
            known_hosts_tmp=$(mktemp)
            trap 'rm -f "$known_hosts_tmp"' EXIT

            # Preserve earlier identical entries by removing only the last match.
            awk '
                {
                    entries[NR] = $0
                    if ($0 == ENVIRON["SSH_KNOWN_HOST_ENTRY"]) last_match = NR
                }
                END {
                    for (i = 1; i <= NR; i++) {
                        if (i != last_match) print entries[i]
                    }
                }
            ' ~/.ssh/known_hosts > "$known_hosts_tmp"
            cat "$known_hosts_tmp" > ~/.ssh/known_hosts
        fi
